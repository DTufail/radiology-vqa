# Phase 6 configuration — use AFTER QLoRA fine-tuning is complete.
#
# To activate the fine-tuned adapter, set VLM_ADAPTER_PATH in your environment
# or .env file. The LLaVABackend will merge the LoRA weights at load time
# (merge_and_unload), giving full inference speed with no LoRA overhead.
#
# Usage:
#   export VLM_ADAPTER_PATH=checkpoints/llava-med-qlora/best
#   python scripts/quick_inference.py --dataset vqa_rad --index 0
#   python scripts/run_evaluation.py --mode agent --max-samples 451

vlm:
  backend: "llava"
  model_id: "llava-hf/llava-v1.6-mistral-7b-hf"
  quantize: "4bit"
  max_new_tokens: 128
  device: "auto"
  concise_mode: true
  adapter_path: "checkpoints/llava-med-qlora/best"   # set after training completes

data:
  index_dir: "data/indices_v2"       # Phase 6B-2 expanded index (~13,400 docs)
                                     # base.yaml still points at data/indices (2,987 docs)

rag:
  retrieval_method: "hybrid"         # BM25 + dense retrieval with Reciprocal Rank Fusion
  bm25_index_dir: "data/bm25_index"  # rebuilt from expanded corpus by build_index.py --bm25
  bm25_top_k: 20                     # BM25 candidates before fusion
  dense_top_k: 20                    # Dense candidates before fusion
  rrf_k: 60                          # RRF smoothing constant (standard value)
  retrieval_top_k: 5                 # Final top-K returned to agent after fusion
  retrieval_min_score: 0.0           # RRF scores are relative; no hard floor needed
