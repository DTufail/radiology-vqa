# Phase 7A configuration — PLACEHOLDER.
#
# This file is a template. Run scripts/sweep_thresholds.py to replace the
# TODO values with optimal thresholds found on the mixed validation set.
#
# Phase 7A-2: re-fitted isotonic calibrator on MIXED validation data
#   (SLAKE val 200 samples + VQA-RAD train last 10% ~306 samples).
#   Fixes distribution mismatch that caused 41% abstention on VQA-RAD test.
#
# Phase 7A-3: per-question-type supervisor thresholds swept on mixed val set.
#   Run: python scripts/sweep_thresholds.py \
#            --predictions-json data/calibration/mixed/val_predictions.json \
#            --output-config configs/phase7a.yaml
#
# Full evaluation:
#   export VLM_ADAPTER_PATH=checkpoints/llava-med-qlora/best
#   python scripts/run_evaluation.py \
#       --mode agent \
#       --dataset vqa_rad \
#       --split test \
#       --no-bertscore \
#       --config configs/phase7a.yaml

vlm:
  backend: "llava"
  model_id: "llava-hf/llava-v1.6-mistral-7b-hf"
  quantize: "4bit"
  max_new_tokens: 128
  device: "auto"
  concise_mode: true
  adapter_path: "checkpoints/llava-med-qlora/best"

data:
  index_dir: "data/indices_v2"

rag:
  retrieval_method: "hybrid"
  bm25_index_dir: "data/bm25_index"
  bm25_top_k: 20
  dense_top_k: 20
  rrf_k: 60
  retrieval_top_k: 5
  retrieval_min_score: 0.0

# Phase 7A-2: isotonic calibrator re-fitted on mixed validation set.
# Replace the path below after running scripts/fit_calibration.py --val-dataset mixed.
calibration_method: "isotonic"
calibration_model_path: "data/calibration/mixed/isotonic_scaler.json"  # TODO: run fit_calibration.py --val-dataset mixed

agent:
  # Phase 7A-3: per-question-type thresholds from threshold sweep on mixed val.
  # TODO: replace these placeholder values by running scripts/sweep_thresholds.py.
  # Sweep target: 10-25% abstention, maximise accuracy_when_answered.
  supervisor_high_confidence: 0.65    # TODO: replace after sweep
  supervisor_low_confidence: 0.35     # TODO: replace after sweep

  # Per-type thresholds (used when supervisor_per_type_thresholds: true).
  supervisor_closed_high_confidence: 0.60   # placeholder — run scripts/sweep_thresholds.py to derive data-driven values
  supervisor_closed_low_confidence:  0.20   # placeholder — run scripts/sweep_thresholds.py to derive data-driven values
  supervisor_open_high_confidence:   0.85   # placeholder — run scripts/sweep_thresholds.py to derive data-driven values
  supervisor_open_low_confidence:    0.55   # placeholder — run scripts/sweep_thresholds.py to derive data-driven values
  supervisor_per_type_thresholds: true      # Phase 7A-1 feature flag

  supervisor_max_retries: 1
