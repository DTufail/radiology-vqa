# Phase 6C configuration — use AFTER running scripts/fit_calibration.py.
#
# Activates Platt-scaled confidence calibration on top of the fine-tuned adapter.
# The calibrator JSON is produced by fit_calibration.py (fit on SLAKE validation).
#
# Usage:
#   export VLM_ADAPTER_PATH=checkpoints/llava-med-qlora/best
#   python scripts/run_evaluation.py --mode agent --max-samples 451
#
# Or source this file via your run script using pydantic env-var overrides.

vlm:
  backend: "llava"
  model_id: "llava-hf/llava-v1.6-mistral-7b-hf"
  quantize: "4bit"
  max_new_tokens: 128
  device: "auto"
  concise_mode: true
  adapter_path: "checkpoints/llava-med-qlora/best"

data:
  index_dir: "data/indices_v2"

rag:
  retrieval_method: "hybrid"
  bm25_index_dir: "data/bm25_index"
  bm25_top_k: 20
  dense_top_k: 20
  rrf_k: 60
  retrieval_top_k: 5
  retrieval_min_score: 0.0

# Phase 6C — Isotonic calibration (fit on SLAKE validation, transferred to VQA-RAD test).
# Isotonic won over Platt: ECE 0.1331 → 0.0047 vs 0.1106 (12 knots, 200 SLAKE val samples).
# Platt params were extreme (a=17.63) due to narrow raw confidence distribution (~0.93 mean).
calibration_method: "isotonic"
calibration_model_path: "data/calibration/isotonic_scaler.json"

agent:
  # Threshold sweep on calibrated SLAKE val shows bimodal distribution after isotonic.
  # low_t=0.35: abstain_rate=15.5%, accuracy_when_answered=88.8% (sweet spot).
  # low_t=0.30: abstain_rate=1.0%,  accuracy_when_answered=80.8% (minimal abstention).
  supervisor_high_confidence: 0.60   # calibrated scores are bimodal — anything above is high
  supervisor_low_confidence: 0.35    # sweep sweet spot: 15.5% abstain, 88.8% accuracy
  supervisor_max_retries: 1
