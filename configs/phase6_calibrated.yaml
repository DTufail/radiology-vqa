# Phase 6C configuration — use AFTER running scripts/fit_calibration.py.
#
# Activates Platt-scaled confidence calibration on top of the fine-tuned adapter.
# The calibrator JSON is produced by fit_calibration.py (fit on SLAKE validation).
#
# Usage:
#   export VLM_ADAPTER_PATH=checkpoints/llava-med-qlora/best
#   python scripts/run_evaluation.py --mode agent --max-samples 451
#
# Or source this file via your run script using pydantic env-var overrides.

vlm:
  backend: "llava"
  model_id: "llava-hf/llava-v1.6-mistral-7b-hf"
  quantize: "4bit"
  max_new_tokens: 128
  device: "auto"
  concise_mode: true
  adapter_path: "checkpoints/llava-med-qlora/best"

data:
  index_dir: "data/indices_v2"

rag:
  retrieval_method: "hybrid"
  bm25_index_dir: "data/bm25_index"
  bm25_top_k: 20
  dense_top_k: 20
  rrf_k: 60
  retrieval_top_k: 5
  retrieval_min_score: 0.0

# Phase 6C — Platt calibration (fit on SLAKE validation, transferred to VQA-RAD test).
# After calibration, the confidence distribution compresses downward, so supervisor
# thresholds must be re-tuned. Run scripts/fit_calibration.py threshold sweep to confirm.
calibration_method: "platt"
calibration_model_path: "data/calibration/platt_scaler.json"

agent:
  # Adjusted for calibrated confidence scores (lower than raw — overconfidence removed).
  # These are starting-point values; tune using the threshold sweep from fit_calibration.py.
  supervisor_high_confidence: 0.70   # was 0.85 for raw scores
  supervisor_low_confidence: 0.40    # was 0.55 for raw scores
  supervisor_max_retries: 1
